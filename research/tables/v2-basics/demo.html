<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vue 3 TableSel Encapsulated Example</title>
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.2.0/dist/reset.css" rel="stylesheet">
    <link href="https://unpkg.com/@vbarbarosh/smcss@1.4.0/dist/sm.css" rel="stylesheet">
    <style>
        table { width: auto; }
    </style>
</head>
<body>

<div id="app">
    <table-sel :items :columns />
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
    const TableSel = {
        name: 'TableSel',
        props: ['items', 'columns'],
        render: function () {
            const slot = this.$slots.tr;
            const columns = this.columns;
            return Vue.h('table', {}, [
                Vue.h('thead', [
                    Vue.h('tr', columns.map(col => Vue.h('th', {class: col.class}, col.label))),
                ]),
                Vue.h('tbody', this.items.map(function (item, idx) {
                    const props = {'data-idx': idx};
                    const default_tds = columns.map(col => Vue.h('td', {class: col.class}, item[col.key]));
                    if (!slot) {
                        return Vue.h('tr', props, default_tds);
                    }
                    // Slot returns [VNode], expect single <tr>
                    const slot_nodes = slot({item, props});
                    // Use first returned VNode, and clone with <td>s as children
                    const tr_node = Array.isArray(slot_nodes) ? slot_nodes[0] : slot_nodes;
                    if (tr_node && tr_node.type === 'tr') {
                        // Clone <tr>, replace children with our <td>s
                        return Vue.h('tr', tr_node.props, default_tds);
                    }
                    else {
                        // fallback if slot doesn't return <tr>
                        return Vue.h('tr', props, default_tds);
                    }
                })),
            ]);
        }
    };

    const app = Vue.createApp({
        components: {TableSel},
        data: function () {
            return {
                columns: [
                    {key: 'id', label: 'ID'},
                    {key: 'name', label: 'Name'},
                    {key: 'age', label: 'Age', class: 'green r'},
                    {key: 'city', label: 'City'},
                    {key: 'occupation', label: 'Occupation'},
                ],
                items: [
                    {id: 1, name: 'Alice Johnson', age: 29, city: 'New York', occupation: 'Software Engineer'},
                    {id: 2, name: 'Bob Smith', age: 35, city: 'Chicago', occupation: 'Marketing Manager'},
                    {id: 3, name: 'Carla Reyes', age: 42, city: 'Houston', occupation: 'Data Analyst'},
                    {id: 4, name: 'David Kim', age: 27, city: 'Seattle', occupation: 'Graphic Designer'},
                    {id: 5, name: 'Emma Wilson', age: 31, city: 'Boston', occupation: 'Product Manager'},
                ],
            };
        },
    });

    app.mount('#app');
</script>
</body>
</html>
